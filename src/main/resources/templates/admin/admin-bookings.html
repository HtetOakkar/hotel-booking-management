<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Bookings - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">

<div class="flex h-screen bg-gray-200">
    <div th:replace="~{admin/fragments/admin-dashboard-sidebar :: sidebar(activePage='bookings')}"></div>

    <div class="flex-1 flex flex-col overflow-hidden">
        <div th:replace="~{admin/fragments/admin-header :: header(pageTitle='Manage Bookings')}"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6 md:p-8">
            <div class="max-w-7xl mx-auto">
                <h1 class="text-2xl font-bold text-gray-800 mb-6">All Bookings</h1>

                <div th:if="${successMessage}" class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-6" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6" th:text="${errorMessage}"></div>

                <div class="bg-white rounded-xl shadow-lg overflow-x-auto">
                    <table class="w-full text-sm text-left text-gray-500">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-100">
                        <tr>
                            <th class="px-6 py-4">Tracking ID</th>
                            <th class="px-6 py-4">Guest Name</th>
                            <th class="px-6 py-4">RoomType</th>
                            <th class="px-6 py-4">Check-in / Check-out</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="booking : ${bookingsPage.content}" class="bg-white border-b hover:bg-gray-50">
                            <td class="px-6 py-4 font-mono text-xs text-gray-700" th:text="${booking.trackingId}"></td>
                            <td class="px-6 py-4 font-medium text-gray-900" th:text="${booking.guestDto != null ? booking.guestDto.name : 'N/A'}"></td>
                            <td class="px-6 py-4" th:text="${booking.roomTypeName}"></td>
                            <td class="px-6 py-4" th:text="${booking.checkInDate} + ' / ' + ${booking.checkOutDate}"></td>
                            <td class="px-6 py-4">
                                    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                                          th:text="${booking.bookingStatus}"
                                          th:classappend="${booking.bookingStatus.name() == 'CONFIRMED'} ? 'bg-green-100 text-green-800' : (${booking.bookingStatus.name() == 'CANCELLED'} ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800')">
                                    </span>
                            </td>
                            <td class="px-6 py-4 text-right space-x-2">
                                <a th:href="@{/admins/bookings/details/{bookingId}(bookingId=${booking.id})}" class="font-medium text-indigo-600 hover:underline">Details</a>
                            </td>
                        </tr>
                        <tr th:if="${bookingsPage.isEmpty()}">
                            <td colspan="6" class="text-center py-8 text-gray-500">No bookings found.</td>
                        </tr>
                        </tbody>
                    </table>
                    <!-- Pagination controls -->
                    <div th:if="${bookingsPage.totalPages > 1}" class="flex justify-between items-center p-4 bg-gray-50 border-t">
                        <span class="text-sm text-gray-700">
                            Showing <span class="font-semibold" th:text="${bookingsPage.number * bookingsPage.size + 1}">1</span>
                            to <span class="font-semibold" th:text="${bookingsPage.number * bookingsPage.size + bookingsPage.numberOfElements}">10</span>
                            of <span class="font-semibold" th:text="${bookingsPage.totalElements}">100</span> results
                        </span>
                        <div class="flex items-center space-x-1">
                            <th:block th:with="prevUrl=@{/admins/bookings(page=${bookingsPage.number - 1}, size=${bookingsPage.size})}">
                                <a th:href="${bookingsPage.hasPrevious()} ? ${prevUrl} : '#'" th:classappend="${!bookingsPage.hasPrevious()} ? 'pointer-events-none text-gray-400' : 'text-gray-600 hover:bg-gray-100'" class="px-3 py-2 rounded-md transition duration-150">&laquo; Prev</a>
                            </th:block>
                            <th:block th:each="i : ${#numbers.sequence(0, bookingsPage.totalPages - 1)}">
                                <a th:href="@{/admins/bookings(page=${i}, size=${bookingsPage.size})}" th:text="${i + 1}" th:classappend="${i == bookingsPage.number} ? 'bg-indigo-600 text-white font-bold' : 'bg-white text-gray-600 hover:bg-gray-100'" class="px-3 py-2 rounded-md border transition duration-150"></a>
                            </th:block>
                            <th:block th:with="nextUrl=@{/admins/bookings(page=${bookingsPage.number + 1}, size=${bookingsPage.size})}">
                                <a th:href="${bookingsPage.hasNext()} ? ${nextUrl} : '#'" th:classappend="${!bookingsPage.hasNext()} ? 'pointer-events-none text-gray-400' : 'text-gray-600 hover:bg-gray-100'" class="px-3 py-2 rounded-md transition duration-150">Next &raquo;</a>
                            </th:block>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:src="@{/js/admin/common.js}"></script>
</body>
</html>
