<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar-link:hover { background-color: #3f51b5; }
        .sidebar-link.active { background-color: #303f9f; font-weight: 600; }
        .submenu-link { color: #cbd5e0; }
        .submenu-link:hover { background-color: #4a5568; color: #ffffff; }
        .submenu-link.submenu-active { color: #ffffff; font-weight: 500; }
    </style>
</head>
<body class="bg-gray-50">

<div class="flex h-screen bg-gray-200">
    <!-- Sidebar Fragment -->
    <div th:replace="~{admin/fragments/admin-dashboard-sidebar :: sidebar(activePage='dashboard')}"></div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Header Fragment -->
        <div th:replace="~{admin/fragments/admin-header :: header(pageTitle='Dashboard')}"></div>

        <!-- Content Area -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6 md:p-8">
            <div class="max-w-7xl mx-auto">
                <!-- Stats Cards -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    <!-- New Bookings -->
                    <div class="bg-white p-6 rounded-xl shadow-lg flex items-center justify-between">
                        <div>
                            <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider">New Bookings</h3>
                            <p class="text-3xl font-bold text-gray-900 mt-2" th:text="${dashboardData.newBookings}">0</p>
                        </div>
                        <div class="bg-indigo-100 rounded-full p-3">
                            <svg class="h-6 w-6 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        </div>
                    </div>
                    <!-- Rooms Occupied -->
                    <div class="bg-white p-6 rounded-xl shadow-lg flex items-center justify-between">
                        <div>
                            <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider">Rooms Occupied</h3>
                            <p class="text-3xl font-bold text-gray-900 mt-2">
                                <span th:text="${dashboardData.roomsOccupied}">0</span> /
                                <span th:text="${dashboardData.totalRooms}">0</span>
                            </p>
                        </div>
                        <div class="bg-blue-100 rounded-full p-3">
                            <svg class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h6m-3 3v4"/></svg>
                        </div>
                    </div>
                    <!-- Total Guests -->
                    <div class="bg-white p-6 rounded-xl shadow-lg flex items-center justify-between">
                        <div>
                            <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider">Total Guests</h3>
                            <p class="text-3xl font-bold text-gray-900 mt-2" th:text="${dashboardData.totalGuests}">0</p>
                        </div>
                        <div class="bg-green-100 rounded-full p-3">
                            <svg class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M15 21a6 6 0 00-9-5.197m0 0A6.995 6.995 0 0012 12.75a6.995 6.995 0 00-3-5.197m0 0A4 4 0 004.75 8.25"/></svg>
                        </div>
                    </div>
                    <!-- Revenue -->
                    <div class="bg-white p-6 rounded-xl shadow-lg flex items-center justify-between">
                        <div>
                            <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider">Revenue</h3>
                            <p class="text-xl font-bold text-gray-900 mt-2" th:text="${#numbers.formatDecimal(dashboardData.totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' MMK'">$0.00</p>
                        </div>
                        <div class="bg-yellow-100 rounded-full p-3">
                            <svg class="h-6 w-6 text-yellow-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v.01M12 12v4m0 4v1m0-1H8m4 0h4m-4-8a3.99 3.99 0 00-3.416-1.992.997.997 0 00-1.25 1.516A3.987 3.987 0 0012 12z" /></svg>
                        </div>
                    </div>
                </div>

                <!-- Recent Messages Panel -->
                <div class="mt-8 bg-white p-6 md:p-8 rounded-xl shadow-lg">
                    <h3 class="text-xl font-semibold text-gray-800 mb-4">Recent Messages</h3>
                    <div th:if="${#lists.isEmpty(recentMessages)}" class="text-center text-gray-500 py-8">
                        <p>No recent messages to show.</p>
                    </div>
                    <div th:unless="${#lists.isEmpty(recentMessages)}" class="divide-y divide-gray-200">
                        <div th:each="message : ${recentMessages}" class="py-4">
                            <p class="font-semibold text-gray-900" th:text="${message.name}"></p>
                            <p class="text-sm text-gray-500" th:text="${message.email}"></p>
                            <p class="mt-2 text-gray-700" th:text="${message.message}"></p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- All JavaScript is now in an external file -->
<script th:src="@{/js/admin/common.js}"></script>

</body>
</html>
