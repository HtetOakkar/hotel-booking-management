<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Management - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar-link:hover { background-color: #3f51b5; }
        .sidebar-link.active { background-color: #303f9f; font-weight: 600; }
    </style>
</head>
<body class="bg-gray-50">

<div class="flex h-screen bg-gray-200">
    <!-- Sidebar -->
    <div th:replace="~{admin/fragments/admin-dashboard-sidebar :: sidebar(activePage='guests')}"></div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <div th:replace="~{admin/fragments/admin-header :: header(pageTitle='Guest Management')}"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6 md:p-8">
            <div class="max-w-7xl mx-auto">
                <h1 class="text-2xl font-bold text-gray-800 mb-6">All Guests</h1>

                <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                    <table class="w-full text-sm text-left text-gray-500">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-100">
                        <tr>
                            <th class="px-6 py-3">Name</th>
                            <th class="px-6 py-3">Email</th>
                            <th class="px-6 py-3">Phone Number</th>
                            <th class="px-6 py-3 text-right">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="guest : ${guestsPage.content}" class="bg-white border-b hover:bg-gray-50">
                            <td class="px-6 py-4 font-medium text-gray-900" th:text="${guest.name}"></td>
                            <td class="px-6 py-4" th:text="${guest.email}"></td>
                            <td class="px-6 py-4" th:text="${guest.phoneNumber}"></td>
                            <td class="px-6 py-4 text-right">
                                <a th:href="@{/admins/guests/details/{guestId}(guestId=${guest.id})}" class="font-medium text-indigo-600 hover:underline">Details</a>
                            </td>
                        </tr>
                        <tr th:if="${guestsPage.empty}">
                            <td colspan="4" class="text-center py-8 text-gray-500">No guests found.</td>
                        </tr>
                        </tbody>
                    </table>
                    <!-- Pagination -->
                    <div th:if="${guestsPage.totalPages > 1}" class="flex justify-between items-center p-4 bg-gray-50 border-t">
                         <span class="text-sm text-gray-700">
                            Showing <span class="font-semibold" th:text="${guestsPage.number * guestsPage.size + 1}">1</span>
                            to <span class="font-semibold" th:text="${guestsPage.number * guestsPage.size + guestsPage.numberOfElements}">10</span>
                            of <span class="font-semibold" th:text="${guestsPage.totalElements}">100</span> results
                        </span>
                        <div class="flex items-center space-x-1">
                            <th:block th:with="prevUrl=@{/admins/guests(page=${guestsPage.number - 1}, size=${guestsPage.size})}">
                                <a th:href="${guestsPage.hasPrevious()} ? ${prevUrl} : '#'" th:classappend="${!guestsPage.hasPrevious()} ? 'pointer-events-none text-gray-400' : 'text-gray-600 hover:bg-gray-100'" class="px-3 py-2 rounded-md transition duration-150">&laquo; Prev</a>
                            </th:block>
                            <th:block th:each="i : ${#numbers.sequence(0, guestsPage.totalPages - 1)}">
                                <a th:href="@{/admins/guests(page=${i}, size=${guestsPage.size})}" th:text="${i + 1}" th:classappend="${i == guestsPage.number} ? 'bg-indigo-600 text-white font-bold' : 'bg-white text-gray-600 hover:bg-gray-100'" class="px-3 py-2 rounded-md border transition duration-150"></a>
                            </th:block>
                            <th:block th:with="nextUrl=@{/admins/guests(page=${guestsPage.number + 1}, size=${guestsPage.size})}">
                                <a th:href="${guestsPage.hasNext()} ? ${nextUrl} : '#'" th:classappend="${!guestsPage.hasNext()} ? 'pointer-events-none text-gray-400' : 'text-gray-600 hover:bg-gray-100'" class="px-3 py-2 rounded-md transition duration-150">Next &raquo;</a>
                            </th:block>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:src="@{/js/admin/common.js}"></script>

</body>
</html>
