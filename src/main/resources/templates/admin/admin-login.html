<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Serene Shore Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="bg-gray-100">
<div class="flex h-screen">
    <!-- Left Side: Login Form -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 md:p-12">
        <div class="w-full max-w-md">
            <h1 class="font-serif text-4xl md:text-5xl font-bold text-gray-800 mb-2">Admin Portal</h1>
            <p class="text-gray-600 mb-8">Please sign in to manage the hotel system.</p>
            <div th:if="${successMessage}" class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-6"><p th:text="${successMessage}"></p></div>

            <!-- Error Message -->
            <div th:if="${param.error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative mb-6" role="alert">
                <strong class="font-bold">Login Failed!</strong>
                <span class="block sm:inline" th:if="${#httpServletRequest.getParameter('error') == 'role'}">You do not have permission to access this portal.</span>
                <span class="block sm:inline" th:unless="${#httpServletRequest.getParameter('error') == 'role'}">Invalid username or password.</span>
            </div>

            <form th:action="@{/admins/login-process}" method="post" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="username" name="username" required
                           class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" name="password" required
                           class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>
                <div>
                    <button type="submit"
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-lg text-sm font-medium text-white bg-gray-800 hover:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-700 transition duration-300 ease-in-out">
                        Sign In
                    </button>
                </div>
            </form>
            <div class="mt-6 text-center">
                <a th:href="@{/static}" class="text-sm text-gray-600 hover:text-gray-800 transition">&larr; Back to Main Website</a>
            </div>
        </div>
    </div>

    <!-- Right Side: Image and Motto -->
    <div class="hidden lg:flex lg:w-1/2 bg-cover bg-center items-center justify-center"
         style="background-image: url('https://images.unsplash.com/photo-1562778612-e1e0cda9915c?q=80&w=2070&auto=format&fit=crop');">
        <div class="text-center bg-black bg-opacity-50 p-10 rounded-lg">
            <h2 class="font-serif text-4xl font-bold text-white" th:text="${hotel.name}">Serene Shore Hotel</h2>
            <p class="text-gray-200 mt-2 text-xl">"Precision in Management, Excellence in Service."</p>
        </div>
    </div>
</div>
</body>
</html>
