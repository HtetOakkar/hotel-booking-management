<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Serene Shores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/heroicons/2.0.18/24/outline/hero-icons.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* A nice blue hover effect for sidebar links */
        .sidebar-link:hover { background-color: #3f51b5; } /* Indigo hover */
        /* A darker blue for the active link */
        .sidebar-link.active { background-color: #303f9f; font-weight: 600; }
    </style>
</head>
<body class="bg-gray-100">

<div class="flex h-screen bg-gray-200">
    <!--
      Sidebar Fragment
      - We replace this div with the sidebar fragment.
      - We pass 'dashboard' as the activePage parameter so the correct link is highlighted.
    -->
    <div th:replace="~{admin/fragments/admin-dashboard-sidebar :: sidebar(activePage='rooms')}"></div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Header -->
        <header class="flex justify-between items-center p-6 bg-white border-b-2 border-gray-200">
            <div class="flex items-center">
                <button id="sidebar-toggle" class="md:hidden mr-4 text-gray-600">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <h2 class="text-2xl font-semibold text-gray-800">Dashboard</h2>
            </div>
            <div class="flex items-center">
                <!-- Simplified Profile Display -->
                <div class="flex items-center">
                    <img class="h-8 w-8 rounded-full" src="https://placehold.co/150x150/E2E8F0/4A5568?text=A" alt="Admin Profile">
                    <span class="ml-2 font-medium">Admin User</span>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
            <!-- This is where the specific page content will be injected -->
            <!-- For example, a dashboard with stats -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h3 class="text-gray-600">New Bookings</h3>
                    <p class="text-3xl font-bold">12</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h3 class="text-gray-600">Rooms Occupied</h3>
                    <p class="text-3xl font-bold">34 / 50</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h3 class="text-gray-600">Total Guests</h3>
                    <p class="text-3xl font-bold">89</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h3 class="text-gray-600">Revenue</h3>
                    <p class="text-3xl font-bold">$12,450</p>
                </div>
            </div>

            <!-- Placeholder for tables or forms -->
            <div class="mt-8 bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-xl font-semibold mb-4">Recent Activity</h3>
                <p class="text-gray-500">Activity feed will go here...</p>
            </div>
        </main>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Mobile sidebar toggle
        const sidebar = document.querySelector('aside');
        const toggleButton = document.getElementById('sidebar-toggle');
        if (toggleButton && sidebar) {
            toggleButton.addEventListener('click', () => {
                sidebar.classList.toggle('hidden');
            });
        }
    });
</script>

</body>
</html>
