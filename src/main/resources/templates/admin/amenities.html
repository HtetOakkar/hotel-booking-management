<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amenities - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .sidebar-link:hover {
            background-color: #3f51b5;
        }

        .sidebar-link.active {
            background-color: #303f9f;
            font-weight: 600;
        }

        .submenu-link {
            color: #cbd5e0;
        }

        .submenu-link:hover {
            background-color: #4a5568;
            color: #ffffff;
        }

        .submenu-link.submenu-active {
            color: #ffffff;
            font-weight: 500;
        }

        .modal-transition {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .modal-hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        .modal-visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
    </style>
</head>
<body class="bg-gray-50">

<div class="flex h-screen bg-gray-200">
    <!-- Sidebar Fragment -->
    <div th:replace="~{admin/fragments/admin-dashboard-sidebar :: sidebar(activePage='settings-amenities')}"></div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Header Fragment -->
        <div th:replace="~{admin/fragments/admin-header :: header(pageTitle='Manage Amenities')}"></div>

        <!-- Content Area -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6 md:p-8">
            <div class="max-w-7xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800">Amenities</h1>
                    <button id="add-amenity-button"
                            class="bg-indigo-600 text-white font-semibold py-2 px-5 rounded-lg hover:bg-indigo-700">Add
                        New Amenity
                    </button>
                </div>

                <div th:if="${successMessage}" class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-6">
                    <p th:text="${successMessage}"></p></div>
                <div th:if="${errorMessage}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6"><p
                        th:text="${errorMessage}"></p></div>

                <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                    <table class="w-full text-sm text-left text-gray-500">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-100">
                        <tr>
                            <th class="px-6 py-3">Image</th>
                            <th class="px-6 py-3">Name</th>
                            <th class="px-6 py-3">Type</th>
                            <th class="px-6 py-3">Assigned Room Types</th>
                            <th class="px-6 py-3 text-right">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="amenity : ${amenitiesPage.content}" class="bg-white border-b hover:bg-gray-50">
                            <td class="px-6 py-4">
                                <img th:src="${amenity.imageUrl}" alt="Amenity Image" class="h-10 w-10 object-contain"
                                     th:if="${amenity.imageUrl != null}">
                                <span th:if="${amenity.imageUrl == null}" class="text-gray-400">No Image</span>
                            </td>
                            <td class="px-6 py-4 font-medium text-gray-900" th:text="${amenity.name}"></td>
                            <td class="px-6 py-4" th:text="${amenity.amenityType.displayName}"></td>
                            <td class="px-6 py-4" th:text="${#strings.listJoin(amenity.roomTypeNames, ', ')}"></td>
                            <td class="px-6 py-4 text-right space-x-2">
                                <button class="edit-amenity-button font-medium text-indigo-600 hover:underline"
                                        th:data-id="${amenity.id}"
                                        th:data-name="${amenity.name}"
                                        th:data-description="${amenity.description}"
                                        th:data-type="${amenity.amenityType}"
                                        th:data-roomtypeids="${#strings.listJoin(amenity.roomTypeIds, ',')}">
                                    Edit
                                </button>
                                <button class="delete-amenity-button font-medium text-red-600 hover:underline"
                                        th:data-id="${amenity.id}" th:data-name="${amenity.name}">
                                    Delete
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${amenitiesPage.isEmpty()}">
                            <td colspan="5" class="text-center py-8 text-gray-500">No amenities found.</td>
                        </tr>
                        </tbody>
                    </table>

                    <!-- Pagination controls -->
                    <div th:if="${amenitiesPage.totalPages > 1}"
                         class="flex justify-between items-center p-4 bg-gray-50 border-t">
                                            <span class="text-sm text-gray-700">
                                                Showing <span class="font-semibold"
                                                              th:text="${amenitiesPage.number * amenitiesPage.size + 1}">1</span>
                                                to <span class="font-semibold"
                                                         th:text="${amenitiesPage.number * amenitiesPage.size + amenitiesPage.numberOfElements}">10</span>
                                                of <span class="font-semibold" th:text="${amenitiesPage.totalElements}">100</span> results
                                            </span>
                        <div class="flex items-center space-x-1">
                            <th:block
                                    th:with="prevUrl=@{/admins/settings/amenities(page=${amenitiesPage.number - 1}, size=${amenitiesPage.size})}">
                                <a th:href="${amenitiesPage.hasPrevious()} ? ${prevUrl} : '#'"
                                   th:classappend="${!amenitiesPage.hasPrevious()} ? 'pointer-events-none text-gray-400' : 'text-gray-600 hover:bg-gray-100'"
                                   class="px-3 py-2 rounded-md transition duration-150">&laquo; Prev</a>
                            </th:block>
                            <th:block th:each="i : ${#numbers.sequence(0, amenitiesPage.totalPages - 1)}">
                                <a th:href="@{/admins/settings/amenities(page=${i}, size=${amenitiesPage.size})}"
                                   th:text="${i + 1}"
                                   th:classappend="${i == amenitiesPage.number} ? 'bg-indigo-600 text-white font-bold' : 'bg-white text-gray-600 hover:bg-gray-100'"
                                   class="px-3 py-2 rounded-md border transition duration-150"></a>
                            </th:block>
                            <th:block
                                    th:with="nextUrl=@{/admins/settings/amenities(page=${amenitiesPage.number + 1}, size=${amenitiesPage.size})}">
                                <a th:href="${amenitiesPage.hasNext()} ? ${nextUrl} : '#'"
                                   th:classappend="${!amenitiesPage.hasNext()} ? 'pointer-events-none text-gray-400' : 'text-gray-600 hover:bg-gray-100'"
                                   class="px-3 py-2 rounded-md transition duration-150">Next &raquo;</a>
                            </th:block>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Add/Edit Amenity Modal -->
<div id="amenity-modal"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 modal-transition modal-hidden">
    <div id="amenity-modal-content" class="bg-white rounded-lg shadow-2xl p-8 max-w-lg w-full m-4">
        <h2 id="amenity-modal-title" class="text-2xl font-bold text-gray-900 mb-6">Add New Amenity</h2>
        <form id="amenity-form" method="post" enctype="multipart/form-data" class="space-y-5">
            <input type="hidden" id="amenityId" name="id"/>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label for="name" class="block text-sm font-medium">Amenity Name</label>
                    <input type="text" id="name" name="name" class="mt-1 block w-full rounded-md py-2 px-3">
                </div>
                <div>
                    <label for="amenityType" class="block text-sm font-medium">Amenity Type</label>
                    <select id="amenityType" name="amenityType" class="mt-1 block w-full rounded-md py-2 px-3">
                        <option th:each="type : ${amenityTypes}" th:value="${type}"
                                th:text="${type.displayName}"></option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium">Assign to Room Type(s)</label>
                <div id="room-type-checkboxes"
                     class="mt-2 grid grid-cols-2 md:grid-cols-3 gap-2 border rounded-md p-3 max-h-40 overflow-y-auto">
                    <div th:each="rt : ${roomTypes}" class="flex items-center">
                        <input th:id="'rt-' + ${rt.id}" type="checkbox" name="roomTypeIds" th:value="${rt.id}"
                               class="h-4 w-4 rounded">
                        <label th:for="'rt-' + ${rt.id}" class="ml-2 text-sm" th:text="${rt.name}"></label>
                    </div>
                </div>
            </div>
            <div>
                <label for="description" class="block text-sm font-medium">Description</label>
                <textarea id="description" name="description" rows="3" class="mt-1 block w-full rounded-md"></textarea>
            </div>
            <div>
                <label for="imageFile" class="block text-sm font-medium">Icon/Image</label>
                <input type="file" id="imageFile" name="imageFile" class="mt-2 block w-full text-sm"/>
            </div>
            <div class="flex justify-end pt-4 space-x-3 border-t">
                <button type="button" id="cancel-amenity-button" class="bg-gray-200 py-2 px-5 rounded-lg">Cancel
                </button>
                <button type="submit" class="bg-indigo-600 text-white py-2 px-5 rounded-lg">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete Confirmation Modal and Form -->
<div id="confirmation-modal"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 modal-transition modal-hidden">
    <div class="bg-white rounded-lg shadow-xl p-6 max-w-sm w-full m-4">
        <h3 class="text-lg font-bold">Confirm Deletion</h3>
        <p id="confirmation-message" class="mt-2 text-sm"></p>
        <div class="mt-6 flex justify-end space-x-3">
            <button id="cancel-delete-button" type="button" class="bg-gray-200 py-2 px-4 rounded-lg">Cancel</button>
            <button id="confirm-delete-button" type="button" class="bg-red-600 text-white py-2 px-4 rounded-lg">Delete
            </button>
        </div>
    </div>
</div>
<form id="delete-amenity-form" method="post" style="display: none;"></form>

<script th:src="@{/js/admin/common.js}"></script>
<script th:src="@{/js/admin/amenities.js}"></script>

</body>
</html>
