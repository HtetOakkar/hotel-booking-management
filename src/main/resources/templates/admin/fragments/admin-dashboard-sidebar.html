<!--
  This fragment defines the admin navigation sidebar.
  The JavaScript for the collapsible menu is in /static/js/admin/common.js
-->
<aside th:fragment="sidebar(activePage)" class="w-64 flex-shrink-0 hidden md:flex md:flex-col bg-gray-800 text-white">

    <div class="flex flex-col flex-grow">
        <div class="p-6">
            <h1 class="text-2xl font-bold" th:text="${hotel.name ?: 'Serene Shores'}">Hotel Name</h1>
            <p class="text-sm text-gray-400">Admin Panel</p>
        </div>
        <nav class="mt-6 flex-grow">
            <!-- Dashboard Link -->
            <a th:href="@{/admins/dashboard}" class="sidebar-link flex items-center py-3 px-6 transition duration-200"
               th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
                <svg class="h-6 w-6 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>
                Dashboard
            </a>

            <!-- Bookings Link -->
            <a th:href="@{/admins/bookings}" class="sidebar-link flex items-center py-3 px-6 transition duration-200"
               th:classappend="${activePage == 'bookings' ? 'active' : ''}">
                <svg class="h-6 w-6 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                Bookings
            </a>

            <!-- Guests Link -->
            <a th:href="@{/admins/guests}" class="sidebar-link flex items-center py-3 px-6 transition duration-200"
               th:classappend="${activePage == 'guests' ? 'active' : ''}">
                <svg class="h-6 w-6 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M15 21a6 6 0 00-9-5.197m0 0A6.995 6.995 0 0012 12.75a6.995 6.995 0 00-3-5.197m0 0A4 4 0 004.75 8.25"/></svg>
                Guests
            </a>

            <!-- Settings Dropdown -->
            <div>
                <button id="settings-toggle" class="sidebar-link w-full flex justify-between items-center py-3 px-6 transition duration-200 focus:outline-none"
                        th:classappend="${activePage != null && activePage.startsWith('settings') ? 'active' : ''}">
                     <span class="flex items-center">
                        <svg class="h-6 w-6 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                        Settings
                     </span>
                    <svg id="settings-arrow-closed" class="h-5 w-5" th:classappend="${activePage != null && activePage.startsWith('settings') ? 'hidden' : ''}" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    <svg id="settings-arrow-open" class="h-5 w-5" th:classappend="${activePage == null || !activePage.startsWith('settings') ? 'hidden' : ''}" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                </button>
                <div id="settings-submenu" class="pl-8 mt-2 space-y-1" th:classappend="${activePage == null || !activePage.startsWith('settings') ? 'hidden' : ''}">
                    <a th:href="@{/admins/settings/hotel}" class="submenu-link block py-2 rounded-md" th:classappend="${activePage == 'settings-hotel' ? 'submenu-active' : ''}">Hotel Info</a>
                    <a th:href="@{/admins/settings/room-types}" class="submenu-link block py-2 rounded-md" th:classappend="${activePage == 'settings-room-types' ? 'submenu-active' : ''}">Room Types</a>
                    <a th:href="@{/admins/settings/amenities}" class="submenu-link block py-2 rounded-md" th:classappend="${activePage == 'settings-amenities' ? 'submenu-active' : ''}">Amenities</a>
                    <a th:href="@{/admins/settings/rooms}" class="submenu-link block py-2 rounded-md" th:classappend="${activePage == 'settings-rooms' ? 'submenu-active' : ''}">Rooms</a>
                    <a th:href="@{/admins/settings/payment-methods}" class="submenu-link block py-2 rounded-md" th:classappend="${activePage == 'settings-payment' ? 'submenu-active' : ''}">Payment Methods</a>
                </div>
            </div>
        </nav>
    </div>

    <div class="p-4">
        <form th:action="@{/admins/logout}" method="post">
            <button type="submit" class="w-full flex items-center justify-center py-2.5 px-4 rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700">
                <svg class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                Logout
            </button>
        </form>
    </div>
</aside>
