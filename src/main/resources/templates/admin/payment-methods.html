<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Methods - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar-link:hover { background-color: #3f51b5; }
        .sidebar-link.active { background-color: #303f9f; font-weight: 600; }
        .submenu-link { color: #cbd5e0; }
        .submenu-link:hover { background-color: #4a5568; color: #ffffff; }
        .submenu-link.submenu-active { color: #ffffff; font-weight: 500; }
        .modal-transition { transition: opacity 0.3s ease, transform 0.3s ease; }
        .modal-hidden { opacity: 0; transform: scale(0.95); pointer-events: none; }

        /* Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #68D391;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #68D391;
        }
    </style>
</head>
<body class="bg-gray-50">

<div class="flex h-screen bg-gray-200">
    <!-- Sidebar -->
    <div th:replace="~{admin/fragments/admin-dashboard-sidebar :: sidebar(activePage='settings-payment')}"></div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <div th:replace="~{admin/fragments/admin-header :: header(pageTitle='Payment Methods')}"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6 md:p-8">
            <div class="max-w-7xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800">Payment Methods</h1>
                    <button id="add-payment-button" class="bg-indigo-600 text-white font-semibold py-2 px-5 rounded-lg hover:bg-indigo-700">Add New Method</button>
                </div>

                <div th:if="${successMessage}" class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-6"><p th:text="${successMessage}"></p></div>
                <div th:if="${errorMessage}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6"><p th:text="${errorMessage}"></p></div>

                <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                    <table class="w-full text-sm text-left text-gray-500">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-100">
                        <tr>
                            <th class="px-6 py-3">Logo</th>
                            <th class="px-6 py-3">Name</th>
                            <th class="px-6 py-3">Status</th>
                            <th class="px-6 py-3 text-right">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="pt : ${paymentTypesPage.content}" class="bg-white border-b hover:bg-gray-50">
                            <td class="px-6 py-4">
                                <img th:src="${pt.imageUrl}" alt="Payment Logo" class="h-8 w-auto object-contain" th:if="${pt.imageUrl != null}">
                                <span th:if="${pt.imageUrl == null}" class="text-gray-400">No Logo</span>
                            </td>
                            <td class="px-6 py-4 font-medium text-gray-900" th:text="${pt.name}"></td>
                            <td class="px-6 py-4">
                                <form th:action="@{/admins/settings/payment-methods/toggle-status/{id}(id=${pt.id})}" method="post" class="inline-flex items-center">
                                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                                        <input type="checkbox" name="toggle" id="'toggle-' + ${pt.id}" th:checked="${pt.isActive}" onchange="this.form.submit()"
                                               class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                                        <label th:for="'toggle-' + ${pt.id}" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                                    </div>
                                    <span th:text="${pt.isActive ? 'Active' : 'Inactive'}" class="text-xs font-semibold"
                                          th:classappend="${pt.isActive ? 'text-green-800' : 'text-red-800'}">
                                    </span>
                                </form>
                            </td>
                            <td class="px-6 py-4 text-right space-x-2">
                                <button class="edit-payment-button font-medium text-indigo-600 hover:underline"
                                        th:data-id="${pt.id}"
                                        th:data-name="${pt.name}"
                                        th:data-isactive="${pt.isActive}">
                                    Edit
                                </button>
                                <button class="delete-payment-button font-medium text-red-600 hover:underline"
                                        th:data-id="${pt.id}" th:data-name="${pt.name}">
                                    Delete
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${paymentTypesPage.isEmpty()}">
                            <td colspan="4" class="text-center py-8 text-gray-500">No payment methods found.</td>
                        </tr>
                        </tbody>
                    </table>
                    <!-- Pagination -->
                    <div th:if="${paymentTypesPage.totalPages > 1}" class="flex justify-between items-center p-4 bg-gray-50 border-t">
                         <span class="text-sm text-gray-700">
                            Showing <span class="font-semibold" th:text="${paymentTypesPage.number * paymentTypesPage.size + 1}">1</span>
                            to <span class="font-semibold" th:text="${paymentTypesPage.number * paymentTypesPage.size + paymentTypesPage.numberOfElements}">10</span>
                            of <span class="font-semibold" th:text="${paymentTypesPage.totalElements}">100</span> results
                        </span>
                        <div class="flex items-center space-x-1">
                            <th:block th:with="prevUrl=@{/admins/settings/payment-methods(page=${paymentTypesPage.number - 1}, size=${paymentTypesPage.size})}">
                                <a th:href="${paymentTypesPage.hasPrevious()} ? ${prevUrl} : '#'" th:classappend="${!paymentTypesPage.hasPrevious()} ? 'pointer-events-none text-gray-400' : 'text-gray-600 hover:bg-gray-100'" class="px-3 py-2 rounded-md transition duration-150">&laquo; Prev</a>
                            </th:block>
                            <th:block th:each="i : ${#numbers.sequence(0, paymentTypesPage.totalPages - 1)}">
                                <a th:href="@{/admins/settings/payment-methods(page=${i}, size=${paymentTypesPage.size})}" th:text="${i + 1}" th:classappend="${i == paymentTypesPage.number} ? 'bg-indigo-600 text-white font-bold' : 'bg-white text-gray-600 hover:bg-gray-100'" class="px-3 py-2 rounded-md border transition duration-150"></a>
                            </th:block>
                            <th:block th:with="nextUrl=@{/admins/settings/payment-methods(page=${paymentTypesPage.number + 1}, size=${paymentTypesPage.size})}">
                                <a th:href="${paymentTypesPage.hasNext()} ? ${nextUrl} : '#'" th:classappend="${!paymentTypesPage.hasNext()} ? 'pointer-events-none text-gray-400' : 'text-gray-600 hover:bg-gray-100'" class="px-3 py-2 rounded-md transition duration-150">Next &raquo;</a>
                            </th:block>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Add/Edit Modal -->
<div id="payment-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 modal-transition modal-hidden">
    <div class="bg-white rounded-lg shadow-2xl p-8 max-w-lg w-full m-4">
        <h2 id="payment-modal-title" class="text-2xl font-bold text-gray-900 mb-6">Add New Payment Method</h2>
        <form id="payment-form" method="post" enctype="multipart/form-data" class="space-y-5">
            <input type="hidden" id="paymentId" name="id" />
            <div>
                <label for="name" class="block text-sm font-medium">Method Name</label>
                <input type="text" id="name" name="name" class="mt-1 block w-full rounded-md py-2 px-3 border-gray-300">
            </div>
            <div>
                <label for="imageFile" class="block text-sm font-medium">Logo/Icon</label>
                <input type="file" id="imageFile" name="imageFile" class="mt-2 block w-full text-sm">
            </div>
            <div class="flex items-center">
                <input id="isActive" name="isActive" type="checkbox" value="true" class="h-4 w-4 rounded border-gray-300 text-indigo-600">
                <label for="isActive" class="ml-2 block text-sm text-gray-900">Is Active</label>
                <input type="hidden" name="_isActive" value="on"/>
            </div>
            <div class="flex justify-end pt-4 space-x-3 border-t">
                <button type="button" id="cancel-payment-button" class="bg-gray-200 py-2 px-5 rounded-lg">Cancel</button>
                <button type="submit" class="bg-indigo-600 text-white py-2 px-5 rounded-lg">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="confirmation-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 modal-transition modal-hidden">
    <div class="bg-white rounded-lg shadow-xl p-6 max-w-sm w-full m-4">
        <h3 class="text-lg font-bold">Confirm Deletion</h3>
        <p id="confirmation-message" class="mt-2 text-sm"></p>
        <div class="mt-6 flex justify-end space-x-3">
            <button id="cancel-delete-button" type="button" class="bg-gray-200 py-2 px-4 rounded-lg">Cancel</button>
            <button id="confirm-delete-button" type="button" class="bg-red-600 text-white py-2 px-4 rounded-lg">Delete</button>
        </div>
    </div>
</div>
<form id="delete-payment-form" method="post" style="display: none;"></form>

<script th:src="@{/js/admin/common.js}"></script>
<script th:src="@{/js/admin/payment-methods.js}"></script>

</body>
</html>
