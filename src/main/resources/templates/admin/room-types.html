<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Types - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar-link:hover { background-color: #3f51b5; }
        .sidebar-link.active { background-color: #303f9f; font-weight: 600; }
        .submenu-link { color: #cbd5e0; }
        .submenu-link:hover { background-color: #4a5568; color: #ffffff; }
        .submenu-link.submenu-active { color: #ffffff; font-weight: 500; }
        .modal-transition { transition: opacity 0.3s ease, transform 0.3s ease; }
        .modal-hidden { opacity: 0; transform: scale(0.95); pointer-events: none; }
        .modal-visible { opacity: 1; transform: scale(1); pointer-events: auto; }
        /* Toggle Switch CSS */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #68D391;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #68D391;
        }
    </style>
</head>
<body class="bg-gray-50">

<div class="flex h-screen bg-gray-200">
    <!-- Sidebar Fragment -->
    <div th:replace="~{admin/fragments/admin-dashboard-sidebar :: sidebar(activePage='settings-room-types')}"></div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Header Fragment -->
        <div th:replace="~{admin/fragments/admin-header :: header(pageTitle='Manage Room Types')}"></div>

        <!-- Content Area -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6 md:p-8">
            <div class="max-w-7xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800">Room Types</h1>
                    <button id="add-room-type-button" class="bg-indigo-600 text-white font-semibold py-2 px-5 rounded-lg">Add New Room Type</button>
                </div>

                <div th:if="${successMessage}" class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-6"><p th:text="${successMessage}"></p></div>
                <div th:if="${errorMessage}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6"><p th:text="${errorMessage}"></p></div>

                <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                    <table class="w-full text-sm text-left text-gray-500">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-100">
                        <tr>
                            <th class="px-6 py-3">Image</th>
                            <th class="px-6 py-3">Name</th>
                            <th class="px-6 py-3">Price/Night</th>
                            <th class="px-6 py-3">Max Guests</th>
                            <th class="px-6 py-3">Featured</th>
                            <th class="px-6 py-3 text-right">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="roomType : ${roomTypesPage.content}" class="bg-white border-b hover:bg-gray-50">
                            <td class="px-6 py-4"><img th:src="${roomType.imageUrl}" alt="Room Type Image" class="h-12 w-16 object-cover rounded-md"></td>
                            <td class="px-6 py-4 font-medium text-gray-900" th:text="${roomType.name}"></td>
                            <td class="px-6 py-4" th:text="'$' + ${#numbers.formatDecimal(roomType.price, 1, 'COMMA', 0, 'POINT')}"></td>
                            <td class="px-6 py-4" th:text="${roomType.maxAdults} + ' Adults, ' + ${roomType.maxChildren} + ' Children'"></td>
                            <td class="px-6 py-4">
                                <form th:action="@{/admins/settings/room-types/toggle-featured/{id}(id=${roomType.id})}" method="post" class="inline-block align-middle">
                                    <button type="submit" class="relative inline-flex items-center h-6 rounded-full w-11"
                                            th:classappend="${roomType.isFeatured} ? 'bg-green-500' : 'bg-gray-300'">
                                        <span class="sr-only">Toggle Featured</span>
                                        <span class="inline-block w-4 h-4 transform bg-white rounded-full transition-transform"
                                              th:classappend="${roomType.isFeatured} ? 'translate-x-6' : 'translate-x-1'"></span>
                                    </button>
                                </form>
                            </td>
                            <td class="px-6 py-4 text-right space-x-2">
                                <button class="manage-amenities-button font-medium text-green-600 hover:underline"
                                        th:data-roomtypeid="${roomType.id}"
                                        th:data-roomtypename="${roomType.name}">
                                    Amenities
                                </button>
                                <button class="edit-room-type-button font-medium text-indigo-600 hover:underline"
                                        th:data-id="${roomType.id}"
                                        th:data-name="${roomType.name}"
                                        th:data-description="${roomType.description}"
                                        th:data-price="${roomType.price}"
                                        th:data-max-adults="${roomType.maxAdults}"
                                        th:data-max-children="${roomType.maxChildren}"
                                        th:data-isfeatured="${roomType.isFeatured}">
                                    Edit
                                </button>
                                <button class="delete-room-type-button font-medium text-red-600 hover:underline"
                                        th:data-id="${roomType.id}" th:data-name="${roomType.name}">
                                    Delete
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <div th:if="${roomTypesPage.totalPages > 1}" class="flex justify-between items-center p-4 bg-gray-50 border-t">
                        <span class="text-sm text-gray-700">
                            Showing <span th:text="${roomTypesPage.number * roomTypesPage.size + 1}"></span>
                            to <span th:text="${roomTypesPage.number * roomTypesPage.size + roomTypesPage.numberOfElements}"></span>
                            of <span th:text="${roomTypesPage.totalElements}"></span>
                        </span>
                        <div class="flex items-center space-x-1">
                            <th:block th:with="prevUrl=@{/admins/settings/room-types(page=${roomTypesPage.number - 1}, size=${roomTypesPage.size})}">
                                <a th:href="${roomTypesPage.hasPrevious()} ? ${prevUrl} : '#'" th:classappend="${!roomTypesPage.hasPrevious()} ? 'pointer-events-none text-gray-400' : ''" class="px-3 py-2 rounded-md">&laquo; Prev</a>
                            </th:block>
                            <th:block th:each="i : ${#numbers.sequence(0, roomTypesPage.totalPages - 1)}">
                                <a th:href="@{/admins/settings/room-types(page=${i}, size=${roomTypesPage.size})}" th:text="${i + 1}" th:classappend="${i == roomTypesPage.number} ? 'bg-indigo-600 text-white' : 'bg-white'" class="px-3 py-2 rounded-md border"></a>
                            </th:block>
                            <th:block th:with="nextUrl=@{/admins/settings/room-types(page=${roomTypesPage.number + 1}, size=${roomTypesPage.size})}">
                                <a th:href="${roomTypesPage.hasNext()} ? ${nextUrl} : '#'" th:classappend="${!roomTypesPage.hasNext()} ? 'pointer-events-none text-gray-400' : ''" class="px-3 py-2 rounded-md">Next &raquo;</a>
                            </th:block>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Add/Edit Room Type Modal -->
<div id="room-type-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 modal-transition modal-hidden">
    <div id="room-type-modal-content" class="bg-white rounded-lg shadow-2xl p-8 max-w-2xl w-full m-4">
        <h2 id="modal-title" class="text-2xl font-bold text-gray-900 mb-6">Add New Room Type</h2>
        <form id="room-type-form" method="post" enctype="multipart/form-data" class="space-y-5">
            <input type="hidden" id="roomTypeId" name="id" />
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label for="name" class="block text-sm font-medium">Room Type Name</label>
                    <input type="text" id="name" name="name" class="mt-1 block w-full rounded-md py-3 px-4">
                </div>
                <div>
                    <label for="price" class="block text-sm font-medium">Price per Night</label>
                    <input type="number" step="0.01" id="price" name="price" class="mt-1 block w-full rounded-md py-3 px-4">
                </div>
                <div>
                    <label for="maxAdults" class="block text-sm font-medium">Max Adults</label>
                    <input type="number" id="maxAdults" name="maxAdults" class="mt-1 block w-full rounded-md py-3 px-4">
                </div>
                <div>
                    <label for="maxChildren" class="block text-sm font-medium">Max Children</label>
                    <input type="number" id="maxChildren" name="maxChildren" class="mt-1 block w-full rounded-md py-3 px-4">
                </div>
            </div>
            <div>
                <label for="description" class="block text-sm font-medium">Description</label>
                <textarea id="description" name="description" rows="4" class="mt-1 block w-full rounded-md"></textarea>
            </div>
            <div>
                <label for="imageFile" class="block text-sm font-medium">Image</label>
                <input type="file" id="imageFile" name="imageFile" class="mt-2 block w-full text-sm"/>
            </div>
            <div class="flex items-center">
                <input id="isFeatured" name="isFeatured" type="checkbox" value="true" class="h-4 w-4 rounded border-gray-300 text-indigo-600">
                <label for="isFeatured" class="ml-2 block text-sm text-gray-900">Feature this room type</label>
                <input type="hidden" name="_isFeatured" value="on"/>
            </div>
            <div class="flex justify-end pt-4 space-x-3 border-t">
                <button type="button" id="cancel-room-type-button" class="bg-gray-200 py-2 px-5 rounded-lg">Cancel</button>
                <button type="submit" class="bg-indigo-600 text-white py-2 px-5 rounded-lg">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<!-- Manage Amenities Modal -->
<div id="manage-amenities-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 modal-transition modal-hidden">
    <div class="bg-white rounded-lg shadow-2xl p-8 max-w-2xl w-full m-4">
        <h2 id="amenities-modal-title" class="text-2xl font-bold text-gray-900 mb-6">Manage Amenities</h2>
        <div id="amenities-list" class="space-y-2 mb-6">
            <!-- Amenities will be loaded here by JavaScript -->
        </div>
        <div class="flex justify-end pt-4 border-t">
            <button type="button" id="close-amenities-button" class="bg-gray-200 py-2 px-5 rounded-lg">Close</button>
        </div>
    </div>
</div>


<!-- Delete Confirmation Modal -->
<div id="confirmation-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 modal-transition modal-hidden">
    <div class="bg-white rounded-lg shadow-xl p-6 max-w-sm w-full m-4">
        <h3 class="text-lg font-bold text-gray-900">Confirm Deletion</h3>
        <p id="confirmation-message" class="mt-2 text-sm text-gray-600"></p>
        <div class="mt-6 flex justify-end space-x-3">
            <button id="cancel-delete-button" type="button" class="bg-gray-200 font-semibold py-2 px-4 rounded-lg">Cancel</button>
            <button id="confirm-delete-button" type="button" class="bg-red-600 text-white font-semibold py-2 px-4 rounded-lg">Delete</button>
        </div>
    </div>
</div>
<form id="delete-room-type-form" method="post" style="display: none;"></form>

<script th:src="@{/js/admin/common.js}"></script>
<script th:src="@{/js/admin/room-types.js}"></script>

</body>
</html>
