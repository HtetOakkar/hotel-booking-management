<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Management - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar-link:hover { background-color: #3f51b5; }
        .sidebar-link.active { background-color: #303f9f; font-weight: 600; }
        .submenu-link { color: #cbd5e0; }
        .submenu-link:hover { background-color: #4a5568; color: #ffffff; }
        .submenu-link.submenu-active { color: #ffffff; font-weight: 500; }
        .modal-transition { transition: opacity 0.3s ease, transform 0.3s ease; }
        .modal-hidden { opacity: 0; transform: scale(0.95); pointer-events: none; }
        .status-select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>');
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.25em;
            padding-right: 2rem;
        }
    </style>
</head>
<body class="bg-gray-50">

<div class="flex h-screen bg-gray-200">
    <!-- Sidebar -->
    <div th:replace="~{admin/fragments/admin-dashboard-sidebar :: sidebar(activePage='settings-rooms')}"></div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <div th:replace="~{admin/fragments/admin-header :: header(pageTitle='Room Management')}"></div>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6 md:p-8">
            <div class="max-w-7xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800">Hotel Rooms</h1>
                    <button id="add-room-button" class="bg-indigo-600 text-white font-semibold py-2 px-5 rounded-lg hover:bg-indigo-700">Add New Room</button>
                </div>

                <div th:if="${successMessage}" class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-6"><p th:text="${successMessage}"></p></div>
                <div th:if="${errorMessage}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6"><p th:text="${errorMessage}"></p></div>

                <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                    <table class="w-full text-sm text-left text-gray-500">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-100">
                        <tr>
                            <th class="px-6 py-3">Room Number</th>
                            <th class="px-6 py-3">Room Type</th>
                            <th class="px-6 py-3">Status</th>
                            <th class="px-6 py-3 text-right">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="room : ${roomsPage.content}" class="bg-white border-b hover:bg-gray-50">
                            <td class="px-6 py-4 font-medium text-gray-900" th:text="${room.roomNumber}">101</td>
                            <td class="px-6 py-4" th:text="${room.roomTypeName}">Deluxe King</td>
                            <td class="px-6 py-4">
                                <!-- Direct Status Update Form -->
                                <form th:action="@{/admins/settings/rooms/update-status/{id}(id=${room.id})}" method="post">
                                    <select name="status" class="status-change-select text-xs font-semibold rounded-full border-0 py-1 pl-3 pr-8 focus:ring-2 focus:ring-indigo-200"
                                            th:classappend="${room.status.name() == 'AVAILABLE'} ? 'bg-green-100 text-green-800' :
                                                               (${room.status.name() == 'BOOKED' or room.status.name() == 'OCCUPIED'} ? 'bg-yellow-100 text-yellow-800' :
                                                               'bg-red-100 text-red-800')">
                                        <option th:each="s : ${T(com.example.hotelbookingmanagement.model.enums.RoomStatus).values()}"
                                                th:value="${s}"
                                                th:text="${s}"
                                                th:selected="${s == room.status}"></option>
                                    </select>
                                </form>
                            </td>
                            <td class="px-6 py-4 text-right space-x-2">
                                <button class="edit-room-button font-medium text-indigo-600 hover:underline"
                                        th:data-id="${room.id}"
                                        th:data-number="${room.roomNumber}"
                                        th:data-status="${room.status}"
                                        th:data-roomtypeid="${room.roomTypeId}">
                                    Edit
                                </button>
                                <button class="delete-room-button font-medium text-red-600 hover:underline"
                                        th:data-id="${room.id}" th:data-name="${room.roomNumber}">
                                    Delete
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <!-- Pagination controls -->
                    <div th:if="${roomsPage.totalPages > 1}" class="flex justify-between items-center p-4 bg-gray-50 border-t">
                        <span class="text-sm text-gray-700">
                            Showing <span class="font-semibold" th:text="${roomsPage.number * roomsPage.size + 1}">1</span>
                            to <span class="font-semibold" th:text="${roomsPage.number * roomsPage.size + roomsPage.numberOfElements}">10</span>
                            of <span class="font-semibold" th:text="${roomsPage.totalElements}">100</span> results
                        </span>
                        <div class="flex items-center space-x-1">
                            <th:block th:with="prevUrl=@{/admins/settings/rooms(page=${roomsPage.number - 1}, size=${roomsPage.size})}">
                                <a th:href="${roomsPage.hasPrevious()} ? ${prevUrl} : '#'" th:classappend="${!roomsPage.hasPrevious()} ? 'pointer-events-none text-gray-400' : 'text-gray-600 hover:bg-gray-100'" class="px-3 py-2 rounded-md transition duration-150">&laquo; Prev</a>
                            </th:block>
                            <th:block th:each="i : ${#numbers.sequence(0, roomsPage.totalPages - 1)}">
                                <a th:href="@{/admins/settings/rooms(page=${i}, size=${roomsPage.size})}" th:text="${i + 1}" th:classappend="${i == roomsPage.number} ? 'bg-indigo-600 text-white font-bold' : 'bg-white text-gray-600 hover:bg-gray-100'" class="px-3 py-2 rounded-md border transition duration-150"></a>
                            </th:block>
                            <th:block th:with="nextUrl=@{/admins/settings/rooms(page=${roomsPage.number + 1}, size=${roomsPage.size})}">
                                <a th:href="${roomsPage.hasNext()} ? ${nextUrl} : '#'" th:classappend="${!roomsPage.hasNext()} ? 'pointer-events-none text-gray-400' : 'text-gray-600 hover:bg-gray-100'" class="px-3 py-2 rounded-md transition duration-150">Next &raquo;</a>
                            </th:block>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Add/Edit Room Modal -->
<div id="room-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 modal-transition modal-hidden">
    <div class="bg-white rounded-lg shadow-2xl p-8 max-w-lg w-full m-4">
        <h2 id="room-modal-title" class="text-2xl font-bold text-gray-900 mb-6">Add New Room</h2>
        <form id="room-form" method="post" class="space-y-5">
            <input type="hidden" id="roomId" name="id" />
            <div>
                <label for="roomNumber" class="block text-sm font-medium">Room Number</label>
                <input type="text" id="roomNumber" name="roomNumber" class="mt-1 block w-full rounded-md py-2 px-3 border-gray-300 shadow-sm">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label for="roomTypeId" class="block text-sm font-medium">Room Type</label>
                    <select id="roomTypeId" name="roomTypeId" class="mt-1 block w-full rounded-md py-2 px-3 border-gray-300 shadow-sm">
                        <option th:each="rt : ${roomTypes}" th:value="${rt.id}" th:text="${rt.name}"></option>
                    </select>
                </div>
                <div>
                    <label for="status" class="block text-sm font-medium">Status</label>
                    <select id="status" name="status" class="mt-1 block w-full rounded-md py-2 px-3 border-gray-300 shadow-sm">
                        <option th:each="s : ${roomStatuses}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end pt-4 space-x-3 border-t">
                <button type="button" id="cancel-room-button" class="bg-gray-200 py-2 px-5 rounded-lg hover:bg-gray-300">Cancel</button>
                <button type="submit" class="bg-indigo-600 text-white py-2 px-5 rounded-lg hover:bg-indigo-700">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="confirmation-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 modal-transition modal-hidden">
    <div class="bg-white rounded-lg shadow-xl p-6 max-w-sm w-full m-4">
        <h3 class="text-lg font-bold text-gray-900">Confirm Deletion</h3>
        <p id="confirmation-message" class="mt-2 text-sm text-gray-600"></p>
        <div class="mt-6 flex justify-end space-x-3">
            <button id="cancel-delete-button" type="button" class="bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded-lg">Cancel</button>
            <button id="confirm-delete-button" type="button" class="bg-red-600 text-white font-semibold py-2 px-4 rounded-lg">Delete</button>
        </div>
    </div>
</div>
<form id="delete-room-form" method="post" style="display: none;"></form>


<script th:src="@{/js/admin/common.js}"></script>
<script th:src="@{/js/admin/rooms.js}"></script>

</body>
</html>
