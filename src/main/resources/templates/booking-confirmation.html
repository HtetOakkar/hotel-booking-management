<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmation - Serene Shores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-gray-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="max-w-4xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden p-8 md:p-12 text-center">

        <div class="mx-auto bg-green-100 rounded-full h-20 w-20 flex items-center justify-center">
            <i class="fas fa-check-circle text-5xl text-green-600"></i>
        </div>

        <h1 class="text-4xl font-bold font-playfair text-gray-900 mt-6">Thank You!</h1>
        <p class="text-lg text-gray-600 mt-2" th:if="${successMessage}" th:text="${successMessage}">Your booking has been successfully placed!</p>

        <div th:if="${bookingDetails}" class="text-left border-t border-gray-200 mt-8 pt-8">
            <h2 class="text-2xl font-bold font-playfair text-gray-800 mb-4">Booking Summary</h2>
            <div class="space-y-4">
                <div class="flex justify-between">
                    <span class="font-medium text-gray-500">Tracking ID:</span>
                    <span class="font-semibold text-gray-800" th:text="${bookingDetails.trackingId}"></span>
                </div>
                <div class="flex justify-between">
                    <span class="font-medium text-gray-500">Check-in:</span>
                    <span class="font-semibold text-gray-800" th:text="${bookingDetails.checkInDate}"></span>
                </div>
                <div class="flex justify-between">
                    <span class="font-medium text-gray-500">Check-out:</span>
                    <span class="font-semibold text-gray-800" th:text="${bookingDetails.checkOutDate}"></span>
                </div>
                <div class="flex justify-between">
                    <span class="font-medium text-gray-500">Payment Method:</span>
                    <span class="font-semibold text-gray-800" th:text="${bookingDetails.paymentTypeName}"></span>
                </div>
                <div class="flex justify-between border-t pt-4 mt-4">
                    <span class="text-lg font-bold text-gray-600">Total Amount:</span>
                    <span class="text-lg font-bold text-indigo-600" th:text="${#numbers.formatDecimal(bookingDetails.totalAmount, 0, 'COMMA', 2, 'POINT')} + ' MMK'"></span>
                </div>
            </div>
        </div>

        <div class="mt-8">
            <a th:href="@{/}" class="bg-indigo-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-indigo-700 transition duration-300">
                Back to Home
            </a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/index_script.js}"></script>

</body>
</html>
