<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Serene Shores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="bg-gray-100">

<!-- Navbar Fragment -->
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6 md:p-8">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-xl shadow-lg p-8">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Booking <span th:text="${booking.trackingId}" class="font-mono text-gray-600"></span></h1>
                    <p class="text-gray-500">Details of the reservation</p>
                </div>
                <span class="px-3 py-1 inline-flex text-sm leading-5 font-semibold rounded-full"
                      th:text="${booking.bookingStatus}"
                      th:classappend="${booking.bookingStatus.name() == 'CONFIRMED'} ? 'bg-green-100 text-green-800' : (${booking.bookingStatus.name() == 'CANCELLED'} ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800')">
                        </span>
            </div>

            <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Guest Details -->
                <div>
                    <h2 class="text-lg font-semibold text-gray-700 mb-4 border-b pb-2">Guest Information</h2>
                    <dl class="space-y-3">
                        <div class="flex justify-between">
                            <dt class="text-gray-500">Name</dt>
                            <dd class="font-medium text-gray-900" th:text="${booking.guestDto.name}"></dd>
                        </div>
                        <div class="flex justify-between">
                            <dt class="text-gray-500">Email</dt>
                            <dd class="text-gray-900" th:text="${booking.guestDto.email}"></dd>
                        </div>
                        <div class="flex justify-between">
                            <dt class="text-gray-500">Phone</dt>
                            <dd class="text-gray-900" th:text="${booking.guestDto.phoneNumber}"></dd>
                        </div>
                    </dl>
                </div>

                <!-- Booking Details -->
                <div>
                    <h2 class="text-lg font-semibold text-gray-700 mb-4 border-b pb-2">Reservation Details</h2>
                    <dl class="space-y-3">
                        <div class="flex justify-between">
                            <dt class="text-gray-500">Room Type</dt>
                            <dd class="font-medium text-gray-900" th:text="${booking.roomTypeName}"></dd>
                        </div>
                        <div class="flex justify-between">
                            <dt class="text-gray-500">Check-in</dt>
                            <dd class="text-gray-900" th:text="${booking.checkInDate}"></dd>
                        </div>
                        <div class="flex justify-between">
                            <dt class="text-gray-500">Check-out</dt>
                            <dd class="text-gray-900" th:text="${booking.checkOutDate}"></dd>
                        </div>
                        <div class="flex justify-between">
                            <dt class="text-gray-500">Nights</dt>
                            <dd class="text-gray-900" th:text="${booking.nights}"></dd>
                        </div>
                        <div class="flex justify-between">
                            <dt class="text-gray-500">Guests</dt>
                            <dd class="text-gray-900" th:text="${booking.adultsNumber} + ' Adults, ' + ${booking.childrenNumber} + ' Children'"></dd>
                        </div>
                    </dl>
                </div>
            </div>

            <!-- Payment Details -->
            <div class="mt-8">
                <h2 class="text-lg font-semibold text-gray-700 mb-4 border-b pb-2">Payment Information</h2>
                <dl class="space-y-3">
                    <div class="flex justify-between">
                        <dt class="text-gray-500">Payment Method</dt>
                        <dd class="font-medium text-gray-900" th:text="${booking.paymentTypeName}"></dd>
                    </div>
                    <div class="flex justify-between text-xl font-bold">
                        <dt class="text-gray-800">Total Amount</dt>
                        <dd class="text-indigo-600" th:text="${#numbers.formatDecimal(booking.totalAmount, 0, 'COMMA', 2, 'POINT')} + ' MMK'"></dd>
                    </div>
                </dl>
            </div>

            <!-- Special Requests -->
            <div th:if="${booking.specialRequests}" class="mt-8">
                <h2 class="text-lg font-semibold text-gray-700 mb-2">Special Requests</h2>
                <p class="text-gray-600 bg-gray-50 p-4 rounded-md" th:text="${booking.specialRequests}"></p>
            </div>

            <div class="mt-8 border-t pt-6 flex justify-between items-center">
                <a th:href="@{/users/profile}" class="bg-gray-200 text-gray-800 font-semibold py-2 px-5 rounded-lg hover:bg-gray-300">
                    Back to Profile
                </a>
                <div class="flex space-x-3">
                    <form th:if="${booking.bookingStatus.name() == 'PENDING' or booking.bookingStatus.name() == 'CONFIRMED'}"
                          th:action="@{/bookings/details/cancel/{bookingId}(bookingId=${booking.id})}" method="post" class="inline">
                        <button type="submit" class="bg-red-600 text-white font-semibold py-2 px-5 rounded-lg hover:bg-red-700">Cancel Booking</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<!-- Footer Fragment -->
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/index_script.js}"></script>

</body>
</html>
