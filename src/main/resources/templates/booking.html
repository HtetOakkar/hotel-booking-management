<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Booking - ' + ${hotel.name}">Booking - Serene Shores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-gray-100 text-gray-800">

<!-- Header & Navigation Bar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-16">
    <div class="container mx-auto px-6">
        <form th:action="@{/bookings/confirm}" th:object="${bookingRequest}" method="post">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">

                <!-- Left Side: Booking Form -->
                <div class="lg:col-span-2 bg-white p-8 rounded-2xl shadow-lg">
                    <h1 class="text-3xl font-bold font-playfair text-gray-900 mb-6">Confirm Your Booking</h1>

                    <div th:if="${errorMessage}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6" th:text="${errorMessage}"></div>

                    <div class="space-y-6">
                        <!-- Hidden fields for submission -->
                        <input type="hidden" name="roomTypeId" th:value="${roomType.id}" />
                        <input type="hidden" name="totalAmount" th:value="${roomType.price}" /> <!-- This should be recalculated based on dates -->


                        <!-- Guest Information -->
                        <section>
                            <h2 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2">Guest Details</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                                <div>
                                    <label for="guestName" class="block text-sm font-medium text-gray-700">Full Name</label>
                                    <input type="text" id="guestName" th:field="*{guestName}" required class="mt-1 block w-full rounded-md border border-gray-200 shadow-sm py-2 px-3">
                                </div>
                                <div>
                                    <label for="guestEmail" class="block text-sm font-medium text-gray-700">Email Address</label>
                                    <input type="email" id="guestEmail" th:field="*{guestEmail}" required class="mt-1 block w-full rounded-md border border-gray-200 shadow-sm py-2 px-3">
                                </div>
                                <div>
                                    <label for="guestPhone" class="block text-sm font-medium text-gray-700">Phone Number</label>
                                    <input type="tel" id="guestPhone" th:field="*{guestPhone}" required class="mt-1 block w-full rounded-md border border-gray-200 shadow-sm py-2 px-3">
                                </div>
                            </div>
                        </section>

                        <!-- Booking Dates & Guests -->
                        <section>
                            <h2 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2">Booking Dates & Guests</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mt-4">
                                <div>
                                    <label for="checkInDate" class="block text-sm font-medium text-gray-700">Check-in Date</label>
                                    <input type="date" id="checkInDate" th:field="*{checkInDate}" th:value="${checkinDate}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm py-2 px-3">
                                </div>
                                <div>
                                    <label for="checkOutDate" class="block text-sm font-medium text-gray-700">Check-out Date</label>
                                    <input type="date" id="checkOutDate" th:field="*{checkOutDate}" th:value="${checkoutDate}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm py-2 px-3">
                                </div>
                                <div>
                                    <label for="adults" class="block text-sm font-medium text-gray-700">Adults</label>
                                    <select id="adults" th:field="*{adults}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm py-2 px-3">
                                        <option th:each="i : ${#numbers.sequence(1, roomType.maxAdults)}" th:value="${i}" th:text="${i}"></option>
                                    </select>
                                </div>
                                <div>
                                    <label for="children" class="block text-sm font-medium text-gray-700">Children</label>
                                    <select id="children" th:field="*{children}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm py-2 px-3">
                                        <option th:each="i : ${#numbers.sequence(0, roomType.maxChildren)}" th:value="${i}" th:text="${i}"></option>
                                    </select>
                                </div>
                            </div>
                        </section>

                        <!-- Special Requests -->
                        <section>
                            <h2 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2">Additional Information</h2>
                            <div>
                                <label for="specialRequests" class="block text-sm font-medium text-gray-700">Special Requests</label>
                                <textarea id="specialRequests" th:field="*{specialRequests}" rows="4" class="mt-1 block w-full rounded-md border border-gray-200 shadow-sm py-2 px-3"></textarea>
                            </div>
                        </section>

                        <!-- Payment Information -->
                        <section>
                            <h2 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2">Payment Method</h2>
                            <div class="mt-4 space-y-4">
                                <div th:each="paymentType, iterStat : ${paymentTypes}" class="flex items-center">
                                    <input th:id="'payment-' + ${paymentType.id}" name="paymentTypeId" type="radio" th:value="${paymentType.id}" th:checked="${iterStat.first}" class="focus:ring-indigo-500 h-4 w-4 text-indigo-600 border-gray-300">
                                    <label th:for="'payment-' + ${paymentType.id}" class="ml-3 block text-sm font-medium text-gray-700">
                                        <img th:if="${paymentType.imageUrl}" th:src="${paymentType.imageUrl}" class="h-8 inline-block mr-2"/>
                                        <span th:text="${paymentType.name}"></span>
                                    </label>
                                </div>
                            </div>
                        </section>

                    </div>
                </div>

                <!-- Right Side: Room Summary -->
                <div class="lg:col-span-1">
                    <div class="bg-white p-8 rounded-2xl shadow-lg sticky top-28">
                        <img th:src="${roomType.imageUrl}" alt="Room Image" class="rounded-lg mb-6 w-full h-48 object-cover">
                        <h2 class="text-2xl font-bold font-playfair" th:text="${roomType.name}">Deluxe King Room</h2>
                        <p class="text-gray-600 mt-2" th:text="${roomType.description}">A beautifully appointed room with a king-size bed and a stunning city view.</p>
                        <div class="mt-6 pt-6 border-t">
                            <div class="flex justify-between items-center">
                                <span class="text-lg font-medium text-gray-700">Price per night:</span>
                                <span class="text-xl font-bold text-gray-900" th:text="${#numbers.formatDecimal(roomType.price, 0, 'COMMA', 0, 'POINT')} + ' MMK'"></span>
                            </div>
                        </div>
                        <!-- Submit Button Moved Here -->
                        <div class="pt-6 mt-6 border-t">
                            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-indigo-700 transition duration-300">
                                Confirm and Book
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </form>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/booking.js}"></script>
<script th:src="@{/js/index_script.js}"></script>

</body>
</html>
