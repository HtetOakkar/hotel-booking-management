<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Contact Us - ' + ${hotel.name}">Contact Us - Serene Shores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-gray-100 text-gray-800">

<!-- Header & Navigation Bar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>
    <!-- Page Header -->
    <section class="bg-gray-700 py-20 text-white text-center">
        <div class="container mx-auto px-6">
            <h1 class="text-4xl md:text-5xl font-playfair font-bold">Get In Touch</h1>
            <p class="text-lg md:text-xl mt-4">We're here to help with any questions you may have.</p>
        </div>
    </section>

    <!-- Contact Section -->
    <section class="py-16">
        <div class="container mx-auto px-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                <!-- Contact Form -->
                <div class="bg-white p-8 rounded-lg shadow-lg">
                    <h3 class="text-3xl font-playfair font-bold mb-6">Send us a Message</h3>

                    <!-- Success Message -->
                    <div th:if="${successMessage}" class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-6">
                        <p th:text="${successMessage}"></p>
                    </div>

                    <form action="#" th:action="@{/contacts/send}" method="post">
                        <div class="mb-4">
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                            <input type="text" id="name" name="name" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div class="mb-4">
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                            <input type="email" id="email" name="email" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div class="mb-4">
                            <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                            <textarea id="message" name="message" rows="5" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 transition duration-300">
                            Send Message
                        </button>
                    </form>
                </div>
                <!-- Contact Info & Map -->
                <div>
                    <div class="bg-white p-8 rounded-lg shadow-lg mb-8">
                        <h3 class="text-3xl font-playfair font-bold mb-6">Contact Information</h3>
                        <p class="text-gray-600 mb-4 flex items-center" th:text="${hotel.address}"><i class="fas fa-map-marker-alt mr-3 text-indigo-600" ></i>73rd St and 41st St, Mandalay</p>
                        <p class="text-gray-600 mb-4 flex items-center" th:text="${hotel.phoneNumber}"><i class="fas fa-phone mr-3 text-indigo-600" ></i>(09) 795-668-587</p>
                        <p class="text-gray-600 flex items-center" th:text="${hotel.email}"><i class="fas fa-envelope mr-3 text-indigo-600" ></i>gemini.oakkar@gmail.com</p>
                    </div>
                    <div class="rounded-lg shadow-lg overflow-hidden">
                        <iframe th:src="${hotel.location}" width="100%" height="350" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/index_script.js}"></script>
</body>
</html>
