<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Room Card Fragment -->
<!-- This fragment expects a 'roomType' object in the context -->
<div th:fragment="roomCard(roomType)" class="bg-white rounded-lg shadow-lg overflow-hidden transform hover:-translate-y-2 transition-transform duration-300 flex flex-col h-full">
    <!-- Image -->
    <div class="relative">
        <img th:if="${roomType.imageUrl != null}" th:src="${roomType.imageUrl}" alt="Photo of a hotel room" class="w-full h-56 object-cover">
        <img th:if="${roomType.imageUrl == null}" src="https://placehold.co/600x400/334155/FFFFFF?text=Room" alt="Photo of a hotel room" class="w-full h-56 object-cover">
    </div>

    <!-- Content -->
    <div class="p-6 flex flex-col flex-grow">
        <h3 th:text="${roomType.name}" class="text-2xl font-playfair font-bold mb-2">Room Name</h3>
        <p th:text="${roomType.description}" class="text-gray-600 mb-4 flex-grow">Room description goes here.</p>
        <div class="flex justify-between items-center mt-auto pt-4 border-t border-gray-100">
            <span class="text-lg font-bold text-indigo-600" th:text="${#numbers.formatDecimal(roomType.price, 0, 'COMMA', 0, 'POINT')} + ' MMK / night'">150,000 MMK / night</span>
            <a th:href="@{/rooms/{id}(id=${roomType.id})}" class="bg-gray-800 text-white py-2 px-4 rounded-lg hover:bg-gray-900 transition duration-300">View Details</a>
        </div>
    </div>
</div>

</body>
</html>
