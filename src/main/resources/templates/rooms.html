<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Our Rooms - ' + ${hotel.name}">Our Rooms - Serene Shores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-gray-100 text-gray-800">

<!-- Header & Navigation Bar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>
    <!-- Page Header -->
    <section class="bg-gray-700 py-20 text-white text-center">
        <div class="container mx-auto px-6">
            <h1 class="text-4xl md:text-5xl font-playfair font-bold">Explore Our Accommodations</h1>
            <p class="text-lg md:text-xl mt-4">Find the perfect room for your stay.</p>
        </div>
    </section>

    <!-- All Rooms Section -->
    <section id="all-rooms" class="py-16">
        <div class="container mx-auto px-6 space-y-16">

            <!-- Title based on context -->
            <div class="text-center mb-12">
                <h2 th:if="${searchPerformed}" class="text-4xl font-playfair font-bold text-gray-800">Search Results</h2>
                <h2 th:unless="${searchPerformed}" class="text-4xl font-playfair font-bold text-gray-800">All Our Rooms</h2>
            </div>

            <!-- No Results Message -->
            <div th:if="${searchPerformed and #lists.isEmpty(allRooms)}" class="text-center py-16">
                <h2 class="text-2xl font-semibold text-gray-700">No Rooms Available</h2>
                <p class="text-gray-500 mt-2">Unfortunately, no rooms match your search criteria. Please try different dates or guest numbers.</p>
                <a th:href="@{/}" class="mt-6 inline-block bg-indigo-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-indigo-700 transition duration-300">
                    Back to Search
                </a>
            </div>

            <!-- Room List -->
            <div th:if="${not #lists.isEmpty(allRooms)}" class="space-y-16">
                <th:block th:each="roomType, iterStat : ${allRooms}">
                    <div th:replace="~{fragments/room_detail_card :: roomDetailCard(roomType=${roomType}, isOdd=${iterStat.odd})}"></div>
                </th:block>
            </div>

        </div>
    </section>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/index_script.js}"></script>
</body>
</html>
