<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Register - ' + ${hotel.name}">Register - Serene Shores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .register-bg {
            background-image: url('https://images.unsplash.com/photo-1582719508461-905c673771fd?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-gray-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<!-- Main Content -->
<main class="flex items-center justify-center min-h-[calc(100vh-80px)] py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-5xl mx-auto">
        <div class="bg-white rounded-2xl shadow-2xl flex flex-col md:flex-row overflow-hidden">

            <!-- Left Side: Image and Motto -->
            <div class="w-full md:w-1/2 register-bg relative min-h-[300px] md:min-h-0">
                <div class="absolute inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center p-12">
                    <div class="text-center">
                        <h1 class="text-4xl xl:text-5xl font-bold font-playfair text-white">Begin Your Journey.</h1>
                        <p class="text-lg xl:text-xl text-gray-200 mt-4">Create your account to unlock exclusive benefits.</p>
                    </div>
                </div>
            </div>

            <!-- Right Side: Registration Form -->
            <div class="w-full md:w-1/2 flex items-center justify-center p-8 sm:p-12">
                <div class="w-full max-w-md">
                    <h2 class="text-3xl font-bold text-gray-800 mb-4">Create an Account</h2>
                    <p class="text-gray-600 mb-8">Join us and start planning your perfect stay.</p>

                    <form id="registrationForm" action="#" th:action="@{/users/register}" th:object="${user}" method="post">
                        <!-- Full Name Input -->
                        <div class="mb-4">
                            <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                            <input type="text" id="fullName" th:field="*{fullName}" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="John Doe">
                        </div>

                        <!-- Email Input -->
                        <div class="mb-4">
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                            <input type="email" id="email" th:field="*{email}" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="your.email@example.com">
                        </div>
                        <div class="mb-4">
                            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                            <input type="text" id="username" th:field="*{username}" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="username">
                        </div>

                        <div class="mb-4">
                            <label for="phone-number" class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                            <input type="text" id="phone-number" th:field="*{phoneNumber}" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="09XXXXXXXX">
                        </div>

                        <!-- Password Input -->
                        <div class="mb-4">
                            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                            <input type="password" id="password" th:field="*{password}" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="••••••••">
                        </div>

                        <!-- Confirm Password Input -->
                        <div class="mb-6">
                            <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="••••••••">
                        </div>

                        <!-- Password Mismatch Error Message -->
                        <div id="passwordError" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative mb-4" role="alert">
                            <span class="block sm:inline">Passwords do not match.</span>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 transition duration-300">
                            Create Account
                        </button>

                        <p class="text-center text-sm text-gray-600 mt-8">
                            Already have an account? <a th:href="@{/users/login}" class="font-medium text-indigo-600 hover:text-indigo-500">Sign In</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    const form = document.getElementById('registrationForm');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const passwordError = document.getElementById('passwordError');

    form.addEventListener('submit', function(event) {
        // Hide error message initially
        passwordError.classList.add('hidden');

        // Check if passwords match
        if (password.value !== confirmPassword.value) {
            // Prevent form submission
            event.preventDefault();
            // Show the error message
            passwordError.classList.remove('hidden');
        }
    });
</script>
<script th:src="@{/js/index_script.js}"></script>

</body>
</html>
